[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "phi-deidentifier"
version = "0.1.0"
description = "Hybrid PHI de-identification pipeline for clinical text (rules + NER + optional LLM)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "portfolio" }]
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "numpy<2.0",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "spacy>=3.7,<3.8",
    "phonenumbers>=8.13",
    "dateparser>=1.2",
    "faker>=24.0",
    "litellm>=1.40",
    "streamlit>=1.33",
    "fhir-clinical-summarizer",
    "en-core-web-lg @ https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.7.1/en_core_web_lg-3.7.1-py3-none-any.whl",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.urls]
Documentation = "https://github.com/clinical-ai-portfolio/phi-deidentifier"

[tool.hatch.build.targets.wheel]
packages = ["src/phi"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
fhir-clinical-summarizer = { path = "../fhir-clinical-summarizer", editable = true }

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = [
    "ignore::DeprecationWarning:litellm.*",
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
]

[tool.coverage.run]
branch = true
source = ["phi"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W", "C90"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint.isort]
known-first-party = ["phi", "clinical_core"]
